name: Theme idea
description: Suggest a new theme, or a change to an existing one's look
labels: [theme]
body:
  - type: textarea
    id: look
    attributes:
      label: The look
      description: What it should look like, what it's based on, and links or pictures that show it
    validations:
      required: true
  - type: dropdown
    id: group
    attributes:
      label: Group
      options: [Sitecore, Everyday, Modern, Retro, Creative, Not sure]
  - type: checkboxes
    id: build
    attributes:
      label: Building it
      options:
        - label: I'd like to build it myself (see CONTRIBUTING.md)
