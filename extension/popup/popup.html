<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Themes for Sitecore</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- Two views side by side: the gear slides the picker out to the left and the settings in from the right -->
  <div id="views">
  <div id="track">
  <div class="view" id="main-view">
  <header>
    <img src="../icons/icon.svg" alt="" width="32" height="32">
    <div>
      <h1>Themes for Sitecore</h1>
      <p id="host" class="muted"></p>
    </div>
    <!-- Light or Dark: the site's choice, shown while its theme has both looks (popup.js syncMode); site-settings.js draws it -->
    <div id="mode" hidden></div>
    <button id="open-settings" class="icon-button" type="button" title="Settings" aria-label="Settings" aria-controls="settings-view" aria-expanded="false" hidden>
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" d="M10.3 2.8h3.4l.5 2.6c.6.2 1.2.5 1.7.9l2.5-.9 1.7 2.9-2 1.8c.1.6.1 1.3 0 1.9l2 1.8-1.7 2.9-2.5-.9c-.5.4-1.1.7-1.7.9l-.5 2.6h-3.4l-.5-2.6c-.6-.2-1.2-.5-1.7-.9l-2.5.9-1.7-2.9 2-1.8c-.1-.6-.1-1.3 0-1.9l-2-1.8 1.7-2.9 2.5.9c.5-.4 1.1-.7 1.7-.9z"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
    </button>
  </header>

  <section id="no-site" hidden>
    <p>Open a Sitecore page, then enable it here.</p>
  </section>

  <section id="disabled" hidden>
    <p>Themes are off on this site.</p>
    <button id="enable" class="primary">Enable on this site</button>
    <p class="muted small">The browser asks you to allow access to this site only.</p>
  </section>

  <section id="enabled" hidden>
    <div id="picker"></div>
  </section>
  </div>

  <div class="view" id="settings-view" role="region" aria-labelledby="settings-title" inert>
    <header>
      <button id="close-settings" class="icon-button" type="button" title="Back to the themes" aria-label="Back to the themes">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div>
        <h1 id="settings-title">Settings</h1>
        <p id="settings-host" class="muted"></p>
      </div>
      <button id="disable" class="danger" type="button">Disable on this site</button>
    </header>

    <!-- the settings open on the first tab (popup.js showSettings) -->
    <div id="settings-tabs" role="tablist" aria-label="Settings">
      <button type="button" role="tab" id="tab-title" aria-controls="pane-title" aria-selected="true">Tab and icon</button>
      <button type="button" role="tab" id="tab-access" aria-controls="pane-access" aria-selected="false" tabindex="-1">Accessibility</button>
      <button type="button" role="tab" id="tab-import" aria-controls="pane-import" aria-selected="false" tabindex="-1">Imported themes<span id="import-count" class="count" hidden></span></button>
    </div>

    <!-- the title and accessibility panes' controls are site-settings.js's, shared with the Sitecore module -->
    <div class="pane" id="pane-title" role="tabpanel" aria-labelledby="tab-title"></div>

    <div class="pane" id="pane-access" role="tabpanel" aria-labelledby="tab-access" hidden></div>

    <div class="pane" id="pane-import" role="tabpanel" aria-labelledby="tab-import" hidden>
      <div class="panel" id="import-body"></div>
    </div>
  </div>
  </div>
  </div>

  <script src="../themes/themes.js"></script>
  <script src="../lib/settings.js"></script>
  <script src="swatch.js"></script>
  <script src="picker.js"></script>
  <script src="site-settings.js"></script>
  <script src="../lib/import.js"></script>
  <script src="import-ui.js"></script>
  <script src="popup.js"></script>
</body>
</html>
