<!doctype html>
<html><head><meta charset="utf-8"><title>ISE</title></head>
<body><div class="ace_editor" style="font-family: monospace"><div class="ace_layer"><div class="ace_line" id="line">x = 1</div></div>
<!-- the variable preview: Ace's tooltip with SPE's markup (PowerShellWebService GetVariableValue), as Ace and ise.css style it -->
<style>.ace_tooltip { background-color: #f5f5f5; border: 1px solid gray; border-radius: 1px; color: black; padding: 3px 4px; position: fixed; white-space: pre-wrap; font-size: smaller; }
.variableType, .undefinedVariableType { padding: 2px; text-align: center; margin-bottom: 5px; }
.variableType { border: 1px #BCE3EE solid; background: #DCF1F6; color: #267F98; }
.undefinedVariableType { border: 1px #FFD8D8 solid; background: #FFEFEF; color: #FF4646; }
.varName { color: #FF4500; } .varChild { padding-left: 40px; display: block; } .childName { color: blue; }</style>
<div class="ace_tooltip" id="tip" style="left: 10px; top: 40px"><div class='variableType'>Sitecore.Data.Items.Item</div><div class='variableLine'><span class='varName'>$item</span> : <span class='varValue'>[Item]</span></div><span class='varChild'><span class='childName'>Name</span> : <span class='childValue'>"Home"</span></span></div>
<div class="ace_tooltip" id="tip-undefined" style="left: 300px; top: 40px"><div class='undefinedVariableType'>undefined</div><div class='variableLine'><span class='varName'>$nothing</span> : <span class='varValue'>$null</span></div></div>
</div>
<div class="terminal"><div class="cmd"><textarea class="clipboard" id="clipboard"></textarea></div></div>
<style>#ProgressOverlay { color: black; background: white; opacity: .9; } /* SPE's Console.css */</style>
<div id="ProgressOverlay"><div><div id="Progress"><h2>Activity</h2><p>Status</p><div id="progressbar"><div style="width:50%"></div></div></div></div></div></body></html>
