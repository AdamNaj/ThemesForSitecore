<!doctype html>
<html>
<head><meta charset="utf-8"><title>Cupertino desktop fixture</title></head>
<body>
  <div id="Desktop">
    <iframe id="FRAME1" srcdoc="<div class='scContentTreeNode'><a>sitecore</a><div><div class='scContentTreeNode'><a>Content</a><div><div class='scContentTreeNode'><a class='scContentTreeNodeActive'>Home</a></div></div></div></div></div>"></iframe>
    <iframe id="FRAME2" srcdoc="<p>Content Editor</p>"></iframe>
    <iframe id="FRAME3" srcdoc="<p>Media Library</p>"></iframe>
  </div>
  <div class="scStartBarScroller" oncontextmenu="log.push('startbar menu'); return false">
    <table id="StartbarApplications"><tbody><tr>
      <td id="startbar_application_FRAME1" class="scInactiveApplication"><div class="scStartBarApplication" onclick="log.push('focus FRAME1')" oncontextmenu="log.push('app menu FRAME1'); return false"><span><img src="/temp/iconcache/apps/16x16/pencil.png">Content Editor</span></div></td>
      <td id="startbar_application_FRAME2" class="scInactiveApplication"><div class="scStartBarApplication" onclick="log.push('focus FRAME2')"><span><img src="/temp/iconcache/apps/16x16/pencil.png">Content Editor</span></div></td>
      <td id="startbar_application_FRAME3" class="scActiveApplication"><div class="scStartBarApplication" onclick="log.push('focus FRAME3')"><span><img src="/temp/iconcache/apps/16x16/pictures.png">Media Library</span></div></td>
      <!-- a window that has closed: Sitecore missed its unload and kept the entry -->
      <td id="startbar_application_FRAME9" class="scInactiveApplication"><div class="scStartBarApplication" onclick="log.push('focus FRAME9')"><span><img src="/temp/iconcache/apps/16x16/workbox.png">Workbox</span></div></td>
    </tr></tbody></table>
  </div>
  <script src="../../../extension/lib/dom-kit.js"></script>
  <script src="../../../extension/themes/cupertino/dom.js"></script>
  <script>
    // What content.js does for a theme's DOM module, reduced to apply and revert.
    window.log = [];
    let kit = null;
    window.applyTheme = () => {
      kit = kit || SCT.createDomKit(document);
      SCT.domModules.cupertino.apply({ doc: document, own: kit.own, addClass: kit.addClass, setAttr: kit.setAttr, move: kit.move });
    };
    window.revertTheme = () => {
      kit.revertAll();
      SCT.domModules.cupertino.revert({ doc: document });
      kit = null;
    };
    // each Dock item: its label, its stack rows, whether it holds the active window
    window.dock = () => [...document.querySelectorAll(".sct-cu-app")].map((a) =>
      `${a.querySelector(".sct-cu-app-icon").getAttribute("aria-label")}/${a.querySelectorAll(".sct-cu-stack-row").length}${a.classList.contains("sct-cu-app-active") ? "*" : ""}`);
    window.focusWindow = (id) => {
      for (const td of document.querySelectorAll("#StartbarApplications td")) {
        td.className = td.id === "startbar_application_" + id ? "scActiveApplication" : "scInactiveApplication";
      }
    };
  </script>
</body>
</html>
